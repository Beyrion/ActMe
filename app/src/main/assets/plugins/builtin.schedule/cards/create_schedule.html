<style>
body { margin:0; padding:0; background:transparent; -webkit-text-size-adjust:100%; }
</style>
<div style="
  background:var(--md-sys-color-surface,#FFFFFF);
  border-radius:12px;
  border:1.5px solid var(--md-sys-color-outline-variant,#CAC4D0);
  padding:14px 16px 12px;
  font-family:system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
">
  <div style="font-size:11px;font-weight:600;color:var(--md-sys-color-primary,#2178E6);margin-bottom:10px;letter-spacing:0.2px;">
    📅 日程已创建
  </div>
  <div style="font-size:17px;font-weight:700;color:var(--md-sys-color-on-surface,#1C1B1F);margin-bottom:5px;line-height:1.3;">
    {{title}}
  </div>
  <div style="font-size:13px;color:var(--md-sys-color-on-surface-variant,#49454F);margin-bottom:12px;line-height:1.5;min-height:6px;">
    {{detail}}
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
    <span style="font-size:11px;padding:3px 10px;border-radius:20px;background:var(--md-sys-color-secondary-container,#E8DEF8);color:var(--md-sys-color-on-surface,#1C1B1F);white-space:nowrap;">{{repeat_label}}</span>
    <span style="font-size:11px;padding:3px 10px;border-radius:20px;background:var(--md-sys-color-secondary-container,#E8DEF8);color:var(--md-sys-color-on-surface,#1C1B1F);white-space:nowrap;">🕐 {{reminder_time}}</span>
  </div>
</div>
